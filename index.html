<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JETCONTROL GAME</title>

<style>

body{
  margin:0;
  background:black;
  color:cyan;
  font-family:Arial;
  overflow:hidden;
}

/* HEADER */
header{
  text-align:center;
  padding:10px;
  border-bottom:2px solid cyan;
}

/* GAME AREA */
#gameArea{
  position:relative;
  width:100%;
  height:70vh;
  background:#020617;
  overflow:hidden;
}

/* PLANE */
#plane{
  position:absolute;
  width:60px;
  height:60px;
  background:cyan;
  border-radius:10px;
  left:200px;
  top:200px;
}

/* ENEMY */
.enemy{
  position:absolute;
  width:40px;
  height:40px;
  background:red;
}

/* DASHBOARD */
.dashboard{
  display:flex;
  justify-content:center;
  gap:20px;
  padding:20px;
}

.card{
  border:2px solid cyan;
  padding:10px;
  border-radius:10px;
}

/* BUTTONS */
button{
  padding:10px 20px;
  margin:5px;
  background:cyan;
  border:none;
  cursor:pointer;
}

</style>
</head>

<body>

<header>
<h1>JETCONTROL REAL GAME ✈️</h1>
</header>

<div id="gameArea">
  <div id="plane"></div>
</div>

<div class="dashboard">
  <div class="card">Score: <span id="score">0</span></div>
  <div class="card">Health: <span id="health">100</span></div>
  <div class="card">Speed: <span id="speed">5</span></div>
</div>

<div style="text-align:center;">
<button onclick="startGame()">Start</button>
<button onclick="boost()">Boost</button>
<button onclick="heal()">Repair</button>
</div>

<script>

/* SOUND ON LOAD */
let startSound = new Audio("https://www.soundjay.com/buttons/sounds/button-3.mp3");
window.onload = () => {
  startSound.play();
};

/* VARIABLES */
let plane = document.getElementById("plane");
let gameArea = document.getElementById("gameArea");

let x = 200;
let y = 200;
let speed = 5;
let score = 0;
let health = 100;

let enemies = [];
let running = false;

/* START GAME */
function startGame(){
  running = true;
}

/* BOOST */
function boost(){
  speed += 3;
  new Audio("https://www.soundjay.com/buttons/sounds/button-4.mp3").play();
}

/* HEAL */
function heal(){
  health = 100;
}

/* KEYBOARD CONTROL */
document.addEventListener("keydown", (e) => {

  if(!running) return;

  if(e.key === "ArrowUp" || e.key === "w") y -= speed;
  if(e.key === "ArrowDown" || e.key === "s") y += speed;
  if(e.key === "ArrowLeft" || e.key === "a") x -= speed;
  if(e.key === "ArrowRight" || e.key === "d") x += speed;

});

/* SPAWN ENEMY */
function spawnEnemy(){
  let enemy = document.createElement("div");
  enemy.classList.add("enemy");

  enemy.style.left = Math.random()*window.innerWidth + "px";
  enemy.style.top = "0px";

  gameArea.appendChild(enemy);

  enemies.push({
    el: enemy,
    y: 0
  });
}

/* GAME LOOP */
setInterval(() => {

  if(!running) return;

  /* MOVE PLANE */
  plane.style.left = x + "px";
  plane.style.top = y + "px";

  /* SPAWN ENEMIES */
  if(Math.random() < 0.03){
    spawnEnemy();
  }

  /* MOVE ENEMIES */
  enemies.forEach((enemyObj, index) => {

    enemyObj.y += 3;
    enemyObj.el.style.top = enemyObj.y + "px";

    let ex = enemyObj.el.offsetLeft;
    let ey = enemyObj.y;

    /* COLLISION */
    if(
      Math.abs(ex - x) < 40 &&
      Math.abs(ey - y) < 40
    ){
      health -= 10;
      enemyObj.el.remove();
      enemies.splice(index,1);

      new Audio("https://www.soundjay.com/buttons/sounds/beep-07.mp3").play();
    }

    /* REMOVE OFFSCREEN */
    if(enemyObj.y > 600){
      enemyObj.el.remove();
      enemies.splice(index,1);
      score += 1;
    }

  });

  /* UPDATE UI */
  document.getElementById("score").innerText = score;
  document.getElementById("health").innerText = health;
  document.getElementById("speed").innerText = speed;

  /* GAME OVER */
  if(health <= 0){
    alert("GAME OVER 💥");
    running = false;
    location.reload();
  }

},30);

</script>

</body>
</html>
